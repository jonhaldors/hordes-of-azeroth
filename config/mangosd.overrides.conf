# Settings that differ from server/run/mangosd.conf.dist.
# tools/apply-config.ps1 merges these into server/run/mangosd.conf.
# Paths are relative to server/run, the directory mangosd is started from.

DataDir = "../data"
LogsDir = "../logs"
HonorDir = "../logs"

# Single-player: only reachable from this machine.
BindIP = "127.0.0.1"

# Hordes of Azeroth: arenas are solo, so raid maps must not need a raid group.
Instance.IgnoreRaid = 1
Instance.IgnoreLevel = 1
# Hard stages hop between raid instances; the stock limit of 5 new
# instances an hour would make a portal refuse to take the player.
Instance.PerHourLimit = 1000

# Dying ends every run; it should not also wear out gear.
DurabilityLoss.Enable = 0

# Heroes get no regular talent points: Talent Shards and the camp talent
# trainer take their place.
Rate.Talent = 0

# GM accounts would otherwise log in unkillable (damage stops at 1 health).
GM.CheatGod = 0

# New heroes enter the world at camp on GM Island; the race intro would fly
# its camera over a starting zone the hero is no longer in.
SkipCinematics = 1

# Hordes of Azeroth: a hit lands on the next map update after it is due, so the
# stock 100 ms showed as a late damage number. Every world tick: 25 ms, the
# core's minimum here (MIN_MAP_UPDATE_DELAY, WORLD_SLEEP_CONST).
MapUpdateInterval = 25
# Players were updated at most every 100 ms, and a run bolt's hit waits for
# the hero's update. Every tick: the throttle only saves CPU on crowded
# servers.
MapUpdate.UpdatePlayersDiff = 25
# Players' movement packets were read at most every 100 ms; every tick, so
# the server's copy of a running hero trails them less.
MapUpdate.UpdatePacketsDiff = 25

# Hordes of Azeroth: no world PvP. The Eastern Plaguelands towers and the
# Silithus dust drew a capture bar over the run timer at the top of the screen.
OutdoorPvP.EP.Enable = 0
OutdoorPvP.SI.Enable = 0

# Hordes of Azeroth: hero records for the patched client's hero screen. The
# repository root is the client folder; mangosd runs in server/run.
Bonk.GlueStatsFile = "../../Interface/GlueXML/BonkStats.lua"

# Hordes of Azeroth: the addon talks to the server in `.bonk` chat commands, and
# the Shift dash sends one a press. 10 messages within a second each would
# mute the player (and every `.bonk` command) for 10 s; single-player, so
# no flood limit. (GM accounts were never counted.)
ChatFlood.MessageCount = 0

# Hordes of Azeroth: run loot is offered before the hero owns it, and the
# loot, vault and vendor windows read the item from the client's cache. The
# stock setting answers item queries from non-GM players with "no such
# item" until someone has obtained it, so new players saw a blank card and
# a question mark. Nothing here is secret: answer every item query.
Item.PreventDataMining = 0

# Hordes of Azeroth: first login line. The server adds "Patch <VERSION>" under
# it, and a yellow notice when the launcher finds a newer release
# (server/run/latest-version.txt).
Motd = "Welcome to Hordes of Azeroth!"

# Hordes of Azeroth: players get a normal account, not a game master one, so
# the rules that only game masters skip have to be lifted for everyone:
# log out at once instead of after 20 seconds, and keep Alliance and Horde
# heroes on one account. (The hourly instance limit is raised further up.)
InstantLogout = 0
AllowTwoSide.Accounts = 1

# Every character shares one player faction (BONK_PLAYER_FACTION), so Alliance
# and Horde characters in one co-op party are friends: they can talk, whisper
# and group with each other.
AllowTwoSide.Interaction.Chat = 1
AllowTwoSide.Interaction.Channel = 1
AllowTwoSide.Interaction.Group = 1

# Runs roll their own weather per stage (BonkRunLooks.cpp), so the
# zone weather system must not overwrite it.
ActivateWeather = 0

# Single-player: the weekly honor maintenance must not restart the server and
# warn the player with a countdown. Ranks still update on the next boot.
AutoHonorRestart = 0
