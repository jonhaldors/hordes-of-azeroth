# Custom auras HoA adds to the 1.12.1 client. Ids 60001-60099 are reserved for HoA.
#
# Every aura names its origin under `source`:
#   card:<id> | mastery:<id> | weapon:<id> | glyph:<id> | keyword:<id> | behavior:<enum> | none
# A sourced aura inherits the source row's name, icon and description. Fields under `display`
# override the source and MUST explain why. `none` and `behavior` have no single row, so they
# must spell out the full display and explain it.
#
# `stacks.source` says where the live count comes from: aura (server-set), copies (card copies),
# kills (card kill counter), seconds (card seconds), wounds (boss wound stacks), none. `max`
# is optional for copies/kills/seconds (the compiler derives it) and required for aura.
# `permanent` maps to durationIndex 0; otherwise the aura is timed.
#
# `dynamic` picks the runtime tooltip text the server sends in the account language:
#   none | shield_absorb | wounds_heal_cut | stack_percent | card_total
# absorb/cut/percent need enUS/zhCN templates with {1} placeholders; card_total uses the card
# description plus its current total.
#
# The compiler emits spell_template SQL, the server ids and hoa_aura/hoa_aura_locale rows; the
# client receives the localized display rows from the server at addon-ready.
