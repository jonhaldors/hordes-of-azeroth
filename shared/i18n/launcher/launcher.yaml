  enUS: This folder is a Hordes of Azeroth source checkout. Install the game into a separate copy of World of Warcraft 1.12.1 instead.
  zhCN: 这个文件夹是艾泽拉斯之潮的源码仓库。请改为把游戏安装到另一份独立的魔兽世界 1.12.1 副本中。
