- id: hoa.launcher.this_is_heavy_work_and_only_happens_once_your_processor_can_
  enUS: This is heavy work and only happens once. Your processor can sit at 100% and your fans may spin up until it's done. To use fewer cores, open the ••• menu next to Play and choose Monster path build speed.
  zhCN: 这项工作很吃资源，而且只会进行一次。完成之前，处理器可能一直满载，风扇也可能高速转动。若想少用几个核心，请打开“开始游戏”旁边的 ••• 菜单，选择“怪物路径生成速度”。
  zhTW: "這項工作很吃資源，而且只會進行一次。完成之前，處理器可能一直滿載，風扇也可能高速轉動。若想少用幾個核心，請開啟“開始遊戲”旁邊的 ••• 選單，選擇“怪物路徑生成速度”。"
- id: hoa.launcher.this_is_heavy_work_your_processor_can_sit_at_100_and_your_fa
  enUS: This is heavy work. Your processor can sit at 100% and your fans may spin up until it finishes. That's expected and nothing is wrong. With half the cores it takes longer, but your PC stays easy to use in the meantime.
  zhCN: 这项工作很吃资源。完成之前，处理器可能一直满载，风扇也可能高速转动，这是正常现象，并不是出了问题。只用一半核心会花更长时间，但期间你的电脑依然流畅好用。
  zhTW: "這項工作很吃資源。完成之前，處理器可能一直滿載，風扇也可能高速轉動，這是正常現象，並不是出了問題。只用一半核心會花更長時間，但期間你的電腦依然流暢好用。"
