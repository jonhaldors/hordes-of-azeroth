  enUS: 'Other players can''t connect to you: your router blocks automatic port forwarding, or your internet provider shares your address. You can still join other games.'
  zhCN: 其他玩家无法连接到你：你的路由器阻止了自动端口转发，或者你的网络运营商与他人共用地址。你仍然可以加入其他玩家的房间。
  zhTW: "其他玩家無法連線到你：你的路由器阻止了自動埠轉發，或者你的網路運營商與他人共用地址。你仍然可以加入其他玩家的房間。"
- id: hoa.launcher.other_players_can_t_reach_0_1_check_that_it_forwards_tcp_to_
  enUS: Other players can't reach {0}:{1}. Check that it forwards TCP to port {2} on this PC.
  zhCN: 其他玩家无法连接到 {0}:{1}。请检查它是否把 TCP 转发到了这台电脑的 {2} 端口。
  zhTW: "其他玩家無法連線到 {0}:{1}。請檢查它是否把 TCP 轉發到了這臺電腦的 {2} 埠。"
- id: hoa.launcher.other_players_can_t_reach_you_on_tcp_port_0_forward_that_por
  enUS: Other players can't reach you on TCP port {0}. Forward that port on your router to this PC and allow the launcher through Windows Firewall, then host again. If your internet provider shares your address, hosting won't work. You can still join other games.
  zhCN: 其他玩家无法通过 TCP 端口 {0} 连接到你。请在路由器上把该端口转发到这台电脑，并允许启动器通过 Windows 防火墙，然后重新创建房间。如果你的网络运营商与他人共用地址，则无法创建房间，但你仍然可以加入其他人的房间。
  zhTW: "其他玩家無法透過 TCP 埠 {0} 連線到你。請在路由器上把該埠轉發到這臺電腦，並允許啟動器透過 Windows 防火牆，然後重新建立房間。如果你的網路運營商與他人共用地址，則無法建立房間，但你仍然可以加入其他人的房間。"
