- id: hoa.launcher.every_zone_gets_a_map_of_where_creatures_can_walk_climb_and_
  enUS: Every zone gets a map of where creatures can walk, climb and fit. Monsters use it to chase you around trees, up ramps and through doorways instead of running into walls, and the horde uses it to spawn only where it can reach you, never inside a rock or on a rooftop.
  zhCN: 每个区域都会生成一张地图，标明生物能在哪里行走、攀爬和通过。怪物借助它绕过树木、爬上坡道、穿过门洞来追击你，而不会一头撞在墙上；怪潮也靠它只在能够抵达你的位置刷新，绝不会刷在岩石里或屋顶上。
  zhTW: "每個區域都會生成一張地圖，標明生物能在哪裡行走、攀爬和透過。怪物藉助它繞過樹木、爬上坡道、穿過門洞來追擊你，而不會一頭撞在牆上；怪潮也靠它只在能夠抵達你的位置重新整理，絕不會刷在岩石裡或屋頂上。"
