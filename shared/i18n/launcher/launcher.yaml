- id: hoa.launcher.couldn_t_connect_to_the_host_both_of_your_routers_block_dire
  enUS: 'Couldn''t connect to the host: both of your routers block direct connections. The host can forward TCP port 3725, or you can both join the same VPN, such as Radmin VPN, ZeroTier or Hamachi, and try again.'
  zhCN: 无法连接到房主：你们双方的路由器都阻止了直接连接。房主可以转发 TCP 端口 3725，或者你们都加入同一个 VPN（例如 Radmin VPN、ZeroTier 或 Hamachi）后再试。
  zhTW: "無法連線到房主：你們雙方的路由器都阻止了直接連線。房主可以轉發 TCP 埠 3725，或者你們都加入同一個 VPN（例如 Radmin VPN、ZeroTier 或 Hamachi）後再試。"
- id: hoa.launcher.couldn_t_connect_to_the_host_their_router_doesn_t_accept_dir
  enUS: Couldn't connect to the host. Their router doesn't accept direct connections, and the backup connection between your two networks failed too. The host can forward TCP port 3725, you can host the game yourself if your port is forwarded, or you can both join the same VPN, such as Radmin VPN, ZeroTier or Hamachi.
  zhCN: 无法连接到房主：对方的路由器不接受直接连接，你们两个网络之间的备用连接也失败了。房主可以转发 TCP 端口 3725；如果你的端口已转发，你也可以自己创建游戏；或者你们都加入同一个 VPN（例如 Radmin VPN、ZeroTier 或 Hamachi）后再试。
  zhTW: "無法連線到房主：對方的路由器不接受直接連線，你們兩個網路之間的備用連線也失敗了。房主可以轉發 TCP 埠 3725；如果你的埠已轉發，你也可以自己建立遊戲；或者你們都加入同一個 VPN（例如 Radmin VPN、ZeroTier 或 Hamachi）後再試。"
- id: hoa.launcher.couldn_t_connect_to_the_host_they_can_only_be_reached_over_t
  enUS: 'Couldn''t connect to the host: they can only be reached over their VPN. Join the same VPN network as the host, such as Radmin VPN, ZeroTier or Hamachi, and try again.'
  zhCN: 无法连接到房主：只能通过其 VPN 访问到房主。请加入与房主相同的 VPN 网络（例如 Radmin VPN、ZeroTier 或 Hamachi）后再试。
  zhTW: "無法連線到房主：只能透過其 VPN 訪問到房主。請加入與房主相同的 VPN 網路（例如 Radmin VPN、ZeroTier 或 Hamachi）後再試。"
