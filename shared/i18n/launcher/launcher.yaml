  enUS: It's worked out from your own game files, one 533-yard square at a time. Westfall, The Barrens and Duskwood come first; the harder zones finish in the background while you play.
  zhCN: 它们由你自己的游戏文件计算得出，每次处理一块 533 码见方的区域。西部荒野、贫瘠之地和暮色森林会最先完成；较难的区域会在你游戏时于后台完成。
  zhTW: "它們由你自己的遊戲檔案計算得出，每次處理一塊 533 碼見方的區域。西部荒野、貧瘠之地和暮色森林會最先完成；較難的區域會在你遊戲時於後臺完成。"
