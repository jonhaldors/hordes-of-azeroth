  enUS: The launcher now works out where monsters can walk in every zone. It builds these maps from your own game files, one area at a time, and it only has to do this once.
  zhCN: 启动器现在要计算出每个区域里怪物能走的地方。它会根据你自己的游戏文件，一次一个区域地生成这些地图，而且只需要做这一次。
  zhTW: "啟動器現在要計算出每個區域裡怪物能走的地方。它會根據你自己的遊戲檔案，一次一個區域地生成這些地圖，而且只需要做這一次。"
