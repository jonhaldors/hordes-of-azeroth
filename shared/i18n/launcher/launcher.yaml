- id: hoa.launcher.hordes_of_azeroth
  enUS: Hordes of Azeroth
  zhCN: 艾泽拉斯之潮
  zhTW: "艾澤拉斯之潮"
- id: hoa.launcher.hordes_of_azeroth_is_in_early_access_can_the_launcher_send_d
  enUS: 'Hordes of Azeroth is in early access. Can the launcher send data about your runs to help balance the game?


    After each run it sends your build, picks, boss times and how the run ended, with a random id for this install. No names, chat or files. You can turn it off any time in the … menu.'
  zhCN: '艾泽拉斯之潮目前处于抢先体验阶段。启动器可以发送你的远征数据，帮助平衡游戏吗？


    每次远征结束后，启动器会发送你的构筑、选择、首领用时和远征的结局，并附带这份安装专用的随机编号。不包含名称、聊天内容或文件。你可以随时在 ••• 菜单中关闭此功能。'
  zhTW: "艾澤拉斯之潮目前處於搶先體驗階段。啟動器可以傳送你的遠征資料，幫助平衡遊戲嗎？\n\n每次遠征結束後，啟動器會傳送你的構築、選擇、首領用時和遠征的結局，並附帶這份安裝專用的隨機編號。不包含名稱、聊天內容或檔案。你可以隨時在 ••• 選單中關閉此功能。"
