- id: hoa.addon.draws_the_3d_world_at_a_fraction_of_the_window_s_resolution_
  enUS: 'Draws the 3D world at a fraction of the window''s resolution, or larger than it. The interface is unaffected at any setting.


    Below 100% trades sharpness for frame rate; above 100% is supersampling, which smooths edges at the cost of frame rate. Applies when you click Apply.'
  zhCN: '以窗口分辨率的一部分（或更高）绘制 3D 世界，界面在任何设置下都不受影响。


    低于100%会用清晰度换取帧率；高于100%则是超级采样，以帧率为代价让边缘更平滑。点击“应用”后生效。'
  zhTW: "以視窗解析度的一部分（或更高）繪製 3D 世界，介面在任何設定下都不受影響。\n\n低於100%會用清晰度換取幀率；高於100%則是超級取樣，以幀率為代價讓邊緣更平滑。點選“應用”後生效。"
