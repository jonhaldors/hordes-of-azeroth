- id: hoa.addon.keeps_the_game_s_sound_playing_while_you_are_working_in_anot
  enUS: 'Keeps the game''s sound playing while you are working in another window.


    With this off, switching away silences the game and switching back restores it. Sounds keep running while they are silenced, so a long one may have finished by the time you return.'
  zhCN: '当你在其他窗口中工作时，让游戏继续播放声音。


    关闭时，切换到其他窗口会让游戏静音，切回来再恢复。静音期间声音仍在继续播放，所以你回来时较长的音效可能已经放完了。'
  zhTW: "當你在其他視窗中工作時，讓遊戲繼續播放聲音。\n\n關閉時，切換到其他視窗會讓遊戲靜音，切回來再恢復。靜音期間聲音仍在繼續播放，所以你回來時較長的音效可能已經放完了。"
