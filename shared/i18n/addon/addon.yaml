- id: hoa.addon.lightens_or_darkens_the_whole_picture_nights_caves_and_inter
  enUS: 'Lightens or darkens the whole picture — nights, caves and interiors are what it is for.


    This is the same correction 1.12 applied through the display''s own gamma ramp, which it could only do in exclusive fullscreen. benilla applies it to the finished image instead, so it works in both display modes.'
  zhCN: '提亮或压暗整个画面——夜晚、洞穴和室内场景最需要它。


    它与 1.12 通过显示器自身的伽马曲线所做的校正相同，只是当年只能在独占全屏下生效。benilla 改为对最终画面进行校正，因此在两种显示模式下都能使用。'
  zhTW: "提亮或壓暗整個畫面——夜晚、洞穴和室內場景最需要它。\n\n它與 1.12 透過顯示器自身的伽馬曲線所做的校正相同，只是當年只能在獨佔全屏下生效。benilla 改為對最終畫面進行校正，因此在兩種顯示模式下都能使用。"
