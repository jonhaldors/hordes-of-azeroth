  enUS: Always display the text on XP, health, mana, rage, energy, or happiness status bars.
  zhCN: 始终在经验、生命、法力、怒气、能量或快乐值状态条上显示文字。
  zhTW: "始終在經驗、生命、法力、怒氣、能量或快樂值狀態條上顯示文字。"
- id: hoa.ui.options.interface.target_of_target.label
  ref: hoa.addon.show_target_of_target
- id: hoa.ui.options.interface.target_of_target.tooltip
  enUS: Toggles the display of the target of your target.
  zhCN: 切换是否显示“目标的目标”。
  zhTW: "切換是否顯示“目標的目標”。"
- id: hoa.ui.options.interface.target_of_target_mode.label
  ref: hoa.addon.show_when
- id: hoa.ui.options.interface.target_of_target_mode.tooltip
  enUS: Sets Target of Target to always display.
  zhCN: 设置“目标的目标”始终显示。
  zhTW: "設定“目標的目標”始終顯示。"
- id: hoa.ui.options.interface.tip_of_the_day.label
  ref: hoa.addon.show_loading_screen_tips
- id: hoa.ui.options.interface.tip_of_the_day.tooltip
  enUS: Uncheck this to hide the tip of the day in the load screens.
  zhCN: 取消勾选可隐藏加载画面上的每日提示。
  zhTW: "取消勾選可隱藏載入畫面上的每日提示。"
- id: hoa.ui.options.keybindings.character_specific
