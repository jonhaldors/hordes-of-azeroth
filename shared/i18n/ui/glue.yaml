- id: hoa.ui.glue.flays_the_nearest_enemy_until_it_dies
  enUS: Flays the nearest enemy until it dies
  zhCN: 持续鞭笞最近的敌人直至其死亡
  zhTW: "持續鞭笞最近的敵人直至其死亡"
- id: hoa.ui.glue.flays_the_nearest_enemy_within_20_yards_dealing_shadow_damag
  enUS: Flays the nearest enemy within 20 yards, dealing Shadow damage, applying 1 stack of Decay and slowing it by 30%. Keeps flaying it until it dies or leaves range.
  zhCN: 鞭笞20码内最近的敌人，造成暗影伤害，施加1层腐朽并使其减速30%。持续鞭笞该敌人直至其死亡或离开范围。
  zhTW: "鞭笞20碼內最近的敵人，造成暗影傷害，施加1層腐朽並使其減速30%。持續鞭笞該敵人直至其死亡或離開範圍。"
- id: hoa.ui.glue.flays_the_nearest_enemy_within_20_yards_dealing_shadow_damag_2
  enUS: Flays the nearest enemy within 20 yards, dealing Shadow damage, applying 1 stack of Decay and slowing it by 30%. Keeps flaying it until it dies or leaves range. Deals 5% more per stack of Decay on the target, up to 30 stacks.
  zhCN: 鞭笞20码内最近的敌人，造成暗影伤害，施加1层腐朽并使其减速30%。持续鞭笞该敌人直至其死亡或离开范围。目标每层腐朽使伤害提高5%，最多计算30层。
  zhTW: "鞭笞20碼內最近的敵人，造成暗影傷害，施加1層腐朽並使其減速30%。持續鞭笞該敵人直至其死亡或離開範圍。目標每層腐朽使傷害提高5%，最多計算30層。"
- id: hoa.ui.glue.for_zerotier_tailscale_a_tunnel_or_a_forward_to_another_port
  enUS: For ZeroTier, Tailscale, a tunnel or a forward to another port. Leave empty otherwise. Games on ZeroTier or Tailscale addresses are invite-code only.
  zhCN: 适用于 ZeroTier、Tailscale、隧道，或转发到其他端口的情况，否则请留空。使用 ZeroTier 或 Tailscale 地址的房间只能凭房间码加入。
  zhTW: "適用於 ZeroTier、Tailscale、隧道，或轉發到其他埠的情況，否則請留空。使用 ZeroTier 或 Tailscale 地址的房間只能憑房間碼加入。"
- id: hoa.ui.glue.for_zerotier_tailscale_a_tunnel_or_a_forwarded_port_otherwis
  enUS: For ZeroTier, Tailscale, a tunnel or a forwarded port. Otherwise leave empty. ZeroTier and Tailscale games can only be joined with a code.
  zhCN: 适用于 ZeroTier、Tailscale、隧道或端口转发。否则请留空。ZeroTier 和 Tailscale 房间只能凭房间码加入。
  zhTW: "適用於 ZeroTier、Tailscale、隧道或埠轉發。否則請留空。ZeroTier 和 Tailscale 房間只能憑房間碼加入。"
