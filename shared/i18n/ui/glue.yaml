- id: hoa.ui.glue.a_shapeshifter_that_changes_between_moonkin_cat_bear_and_tre
  enUS: A shapeshifter that changes between Moonkin, Cat, Bear and Tree of Life. Every spell works in every form, and the right form makes it 30% stronger.
  zhCN: 在枭兽、猎豹、巨熊和生命之树之间变换形态的变形者。每个法术在任何形态下都能施放，对应的形态会使其强化30%。
  zhTW: "在梟獸、獵豹、巨熊和生命之樹之間變換形態的變形者。每個法術在任何形態下都能施放，對應的形態會使其強化30%。"
- id: hoa.ui.glue.a_shapeshifter_that_shifts_between_moonkin_cat_bear_and_tree
  enUS: A shapeshifter that shifts between Moonkin, Cat, Bear and Tree of Life. Every spell works in every form, and the matching form makes it 30% stronger.
  zhCN: 在枭兽、猎豹、巨熊和生命之树之间变换形态的变形者。每个法术在任何形态下都能施放，对应的形态会使其强化30%。
  zhTW: "在梟獸、獵豹、巨熊和生命之樹之間變換形態的變形者。每個法術在任何形態下都能施放，對應的形態會使其強化30%。"
