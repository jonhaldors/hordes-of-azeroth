  zhTW: "為你治療並抽打附近的敵人"
- id: hoa.ui.glue.heals_you_for_0_3_of_your_maximum_health_its_thorny_bloom_la
  enUS: Heals you for 0.3% of your maximum health. Its thorny bloom lashes the 3 nearest enemies for Nature damage. Empowered in Tree of Life.
  zhCN: 为你恢复0.3%最大生命值。其多刺的花朵会抽打最近的3个敌人，造成自然伤害。生命之树形态下获得强化。
  zhTW: "為你恢復0.3%最大生命值。其多刺的花朵會抽打最近的3個敵人，造成自然傷害。生命之樹形態下獲得強化。"
- id: hoa.ui.glue.heals_you_for_1_of_your_maximum_health_every_sec_at_full_hea
  enUS: Heals you for 1% of your maximum health every sec. At full health, it smites the nearest enemy within 30 yards for Holy damage instead.
  zhCN: 每秒为你恢复1%最大生命值。生命值全满时，改为惩击30码内最近的敌人，造成神圣伤害。
  zhTW: "每秒為你恢復1%最大生命值。生命值全滿時，改為懲擊30碼內最近的敵人，造成神聖傷害。"
- id: hoa.ui.glue.heals_you_for_1_of_your_maximum_health_every_sec_at_full_hea_2
  enUS: 'Heals you for 1% of your maximum health every sec. At full health, it smites the nearest enemy within 30 yards for Holy damage instead. With Power Word: Shield, healing past full health tops up your Shield, up to its size.'
  zhCN: 每秒为你恢复1%最大生命值。生命值全满时，改为惩击30码内最近的敌人，造成神圣伤害。拥有真言术：盾时，超出满生命值的治疗会补充你的护盾，最多补充至护盾上限。
  zhTW: "每秒為你恢復1%最大生命值。生命值全滿時，改為懲擊30碼內最近的敵人，造成神聖傷害。擁有真言術：盾時，超出滿生命值的治療會補充你的護盾，最多補充至護盾上限。"
