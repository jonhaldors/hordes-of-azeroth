  enUS: Every 2nd strike from your other Paladin spells releases a burst of light, dealing Holy damage to the target and all enemies within 5 yards of it.
  zhCN: 你的其他圣骑士法术每第2次打击会释放一次圣光爆发，对目标及其5码内的所有敌人造成神圣伤害。
  zhTW: "你的其他聖騎士法術每第2次打擊會釋放一次聖光爆發，對目標及其5碼內的所有敵人造成神聖傷害。"
- id: hoa.ui.glue.every_3rd_hit_from_your_other_shaman_spells_and_feral_spirit
  enUS: Every 3rd hit from your other Shaman spells and Feral Spirit bites hurls a free Lightning Bolt at the nearest enemy within 30 yards, or at the 3 nearest if you know Chain Lightning, dealing Nature damage and applying 1 stack of Static. Lightning Shield and totem hits don't count.
  zhCN: 你的其他萨满法术和野性狼魂的撕咬每第3次命中会免费向30码内最近的敌人掷出一道闪电箭；若你学会闪电链，则改为向最近的3个敌人，造成自然伤害并施加1层静电。闪电之盾和图腾的命中不计入。
  zhTW: "你的其他薩滿法術和野性狼魂的撕咬每第3次命中會免費向30碼內最近的敵人擲出一道閃電箭；若你學會閃電鏈，則改為向最近的3個敵人，造成自然傷害並施加1層靜電。閃電之盾和圖騰的命中不計入。"
