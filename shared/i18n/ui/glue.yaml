  zhTW: "你的衝刺變為閃現術，使你瞬間傳送，充能次數增加1次，冷卻時間縮短30%。每次閃現都會在你離開的位置引發一次魔爆術，對10碼內的敵人造成奧術傷害。佔用一個法術槽位。"
