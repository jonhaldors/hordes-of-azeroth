  enUS: Slams all enemies within 10 yards of you, dealing 2% more damage for each 1% of your maximum health in your Shield, up to 200% more.
  zhCN: 猛击你10码内的所有敌人，你的护盾每相当于1%最大生命值，伤害提高2%，最多提高200%。
  zhTW: "猛擊你10碼內的所有敵人，你的護盾每相當於1%最大生命值，傷害提高2%，最多提高200%。"
