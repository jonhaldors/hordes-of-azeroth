- id: hoa.ui.glue.every_5th_melee_hit_hurls_a_free_lightning_bolt_at_the_neare
  enUS: Every 5th melee hit hurls a free Lightning Bolt at the nearest enemy, or a Chain Lightning if you have it, dealing Nature damage. Melee hits are Windfury Weapon swings, Stormstrike and Feral Spirit bites.
  zhCN: 每5次近战命中会免费向最近的敌人掷出一道闪电箭，若你拥有闪电链则改为闪电链，造成自然伤害。近战命中包括风怒武器挥击、风暴打击和野性狼魂的撕咬。
  zhTW: "每5次近戰命中會免費向最近的敵人擲出一道閃電箭，若你擁有閃電鏈則改為閃電鏈，造成自然傷害。近戰命中包括風怒武器揮擊、風暴打擊和野性狼魂的撕咬。"
- id: hoa.ui.glue.every_hit_from_your_other_paladin_spells_splash_and_area_hit
  enUS: Every hit from your other Paladin spells, splash and area hits included, deals 20% extra as Holy damage.
  zhCN: 你的其他圣骑士法术的每次命中，包括溅射和范围命中，都额外造成20%的神圣伤害。
  zhTW: "你的其他聖騎士法術的每次命中，包括濺射和範圍命中，都額外造成20%的神聖傷害。"
- id: hoa.ui.glue.every_open_slot_has_a_pending_join_request_try_again_shortly
  enUS: Every open slot has a pending join request. Try again shortly.
  zhCN: 所有空位都有待处理的加入请求。请稍后再试。
  zhTW: "所有空位都有待處理的加入請求。請稍後再試。"
- id: hoa.ui.glue.every_sec_heals_you_for_0_25_of_your_maximum_health_per_near
  enUS: Every sec, heals you for 0.25% of your maximum health per nearby enemy, up to 5. Empowered in Bear Form.
  zhCN: 每秒根据附近的敌人数量为你恢复生命值，每个敌人恢复0.25%最大生命值，最多计算5个。巨熊形态下获得强化。
  zhTW: "每秒根據附近的敵人數量為你恢復生命值，每個敵人恢復0.25%最大生命值，最多計算5個。巨熊形態下獲得強化。"
- id: hoa.ui.glue.every_sec_heals_you_for_0_3_of_your_maximum_health_and_lashe
  enUS: Every sec, heals you for 0.3% of your maximum health and lashes the 3 nearest enemies within 10 yards for Nature damage. Healing past full health makes your attacks and dots tick 15% more often for 3 sec. Empowered in Tree of Life.
  zhCN: 每秒为你恢复0.3%最大生命值，并抽打10码内最近的3个敌人，造成自然伤害。超出满生命值的治疗会使你的攻击和持续伤害效果的结算频率在3秒内提高15%。生命之树形态下获得强化。
  zhTW: "每秒為你恢復0.3%最大生命值，並抽打10碼內最近的3個敵人，造成自然傷害。超出滿生命值的治療會使你的攻擊和持續傷害效果的結算頻率在3秒內提高15%。生命之樹形態下獲得強化。"
