  enUS: Shields you for 10% of your maximum health; each cast tops it back up instead of stacking. You move 10% faster while shielded.
  zhCN: 为你施加护盾，可吸收相当于10%最大生命值的伤害；每次施法会将护盾补满而非叠加。持有护盾期间你的移动速度提高10%。
  zhTW: "為你施加護盾，可吸收相當於10%最大生命值的傷害；每次施法會將護盾補滿而非疊加。持有護盾期間你的移動速度提高10%。"
- id: hoa.ui.glue.shocks_the_enemy_with_the_most_static_for_nature_damage_50_m
  enUS: Shocks the enemy with the most Static for Nature damage, 50% more per Static stack. Consumes the stacks in a discharge that also hits up to 3 enemies within 6 yards, and each stack consumed restores 1 Lightning Shield charge.
  zhCN: 震击静电层数最多的敌人，造成自然伤害，每层静电使伤害提高50%。消耗这些层数进行放电，还会命中6码内最多3个敌人，每消耗一层便恢复1层闪电之盾充能。
  zhTW: "震擊靜電層數最多的敵人，造成自然傷害，每層靜電使傷害提高50%。消耗這些層數進行放電，還會命中6碼內最多3個敵人，每消耗一層便恢復1層閃電之盾充能。"
- id: hoa.ui.glue.shocks_the_enemy_with_the_most_static_for_nature_damage_50_m_2
  enUS: Shocks the enemy with the most Static for Nature damage, 50% more per Static stack. Consumes the stacks in a discharge that also hits up to 3 nearby enemies.
  zhCN: 震击静电层数最多的敌人，造成自然伤害，每层静电使伤害提高50%。消耗这些层数进行放电，还会命中最多3个附近敌人。
  zhTW: "震擊靜電層數最多的敵人，造成自然傷害，每層靜電使傷害提高50%。消耗這些層數進行放電，還會命中最多3個附近敵人。"
