  zhCN: 你的其他圣骑士法术每第3次打击会释放一次圣光爆发，对目标及其5码内的所有敌人造成神圣伤害。
  zhTW: "你的其他聖騎士法術每第3次打擊會釋放一次聖光爆發，對目標及其5碼內的所有敵人造成神聖傷害。"
