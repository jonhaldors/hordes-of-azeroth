- id: hoa.ui.glue.hurls_a_fiery_ball_at_the_nearest_enemy_dealing_fire_damage_
  enUS: Hurls a fiery ball at the nearest enemy, dealing Fire damage and applying 2 stacks of Burning.
  zhCN: 向最近的敌人掷出一个火球，造成火焰伤害并施加2层燃烧。
  zhTW: "向最近的敵人擲出一個火球，造成火焰傷害並施加2層燃燒。"
- id: hoa.ui.glue.hurls_a_hammer_at_the_strongest_enemy_within_20_yards_dealin
  enUS: Hurls a hammer at the strongest enemy within 20 yards, dealing Holy damage and stunning it for 2 sec. Bosses and mini-bosses are not stunned.
  zhCN: 向20码内最强的敌人掷出一柄战锤，造成神圣伤害并使其昏迷2秒。首领和小首领不会被昏迷。
  zhTW: "向20碼內最強的敵人擲出一柄戰錘，造成神聖傷害並使其昏迷2秒。首領和小首領不會被昏迷。"
- id: hoa.ui.glue.hurls_a_hammer_at_the_strongest_enemy_within_20_yards_dealin_2
  enUS: Hurls a hammer at the strongest enemy within 20 yards, dealing Holy damage and stunning it for 2 sec. Bosses are not stunned.
  zhCN: 向20码内最强的敌人掷出一柄战锤，造成神圣伤害并使其昏迷2秒。首领不会被昏迷。
  zhTW: "向20碼內最強的敵人擲出一柄戰錘，造成神聖傷害並使其昏迷2秒。首領不會被昏迷。"
- id: hoa.ui.glue.hurls_a_holy_shield_at_the_nearest_enemy_within_25_yards_for
  enUS: Hurls a holy shield at the nearest enemy within 25 yards for Holy damage. It jumps to 4 more enemies within 10 yards, never the same one twice. Each hit counts as a Paladin strike.
  zhCN: 向25码内最近的敌人掷出一面圣光之盾，造成神圣伤害。它会弹向10码内的另外4个敌人，且不会重复命中同一个敌人。每次命中都算作一次圣骑士打击。
  zhTW: "向25碼內最近的敵人擲出一面聖光之盾，造成神聖傷害。它會彈向10碼內的另外4個敵人，且不會重複命中同一個敵人。每次命中都算作一次聖騎士打擊。"
- id: hoa.ui.glue.hurls_a_huge_fireball_at_an_elite_or_boss_or_else_the_larges
  enUS: Hurls a huge fireball at an elite or boss, or else the largest group, dealing heavy Fire damage to the target and 35% of it to enemies within 6 yards.
  zhCN: 向一个精英或首领掷出巨型火球，若没有则掷向最大的敌群，对目标造成高额火焰伤害，并对其6码内的敌人造成35%的伤害。
  zhTW: "向一個精英或首領擲出巨型火球，若沒有則擲向最大的敵群，對目標造成高額火焰傷害，並對其6碼內的敵人造成35%的傷害。"
- id: hoa.ui.glue.hurls_a_magma_totem_onto_the_largest_group_of_enemies_within
  enUS: Hurls a Magma Totem onto the largest group of enemies within 25 yards. It pulses fire every 2 sec, dealing Fire damage and applying 1 stack of Burning to enemies within 8 yards, and is hurled again once none are in reach.
  zhCN: 将熔岩图腾掷向25码内最大的敌群。它每2秒喷发火焰，对8码内的敌人造成火焰伤害并施加1层燃烧；当范围内没有敌人时，会再次被掷出。
  zhTW: "將熔岩圖騰擲向25碼內最大的敵群。它每2秒噴發火焰，對8碼內的敵人造成火焰傷害並施加1層燃燒；當範圍內沒有敵人時，會再次被擲出。"
- id: hoa.ui.glue.hurls_hammers_at_up_to_3_enemies_below_20_health_within_30_y
  enUS: Hurls hammers at up to 3 enemies below 20% health within 30 yards. Normal enemies are slain; elites and bosses take heavy Holy damage.
  zhCN: 向30码内最多3个生命值低于20%的敌人掷出战锤。普通敌人被直接击杀；精英和首领受到高额神圣伤害。
  zhTW: "向30碼內最多3個生命值低於20%的敵人擲出戰錘。普通敵人被直接擊殺；精英和首領受到高額神聖傷害。"
- id: hoa.ui.glue.hurls_lightning_at_the_nearest_enemy_bouncing_to_1_more_deal
  enUS: Hurls lightning at the nearest enemy, bouncing to 1 more, dealing Nature damage and 1 stack of Static to each.
  zhCN: 向最近的敌人掷出闪电，并弹向1个额外敌人，对每个敌人造成自然伤害并施加1层静电。
  zhTW: "向最近的敵人擲出閃電，並彈向1個額外敵人，對每個敵人造成自然傷害並施加1層靜電。"
- id: hoa.ui.glue.hurls_lightning_at_the_nearest_enemy_bouncing_to_1_more_deal_2
