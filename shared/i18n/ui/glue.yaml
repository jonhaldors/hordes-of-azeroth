- id: hoa.ui.glue.hits_from_your_other_paladin_spells_splash_included_deal_30_
  enUS: Hits from your other Paladin spells, splash included, deal 30% extra as Holy damage. Judgement deals 50% more damage instead. Consecration, Retribution Aura and Seal of Command are not affected.
  zhCN: 你的其他圣骑士法术的命中（包括溅射）会额外造成30%的神圣伤害。审判则改为提高50%伤害。奉献、惩罚光环和命令圣印不受影响。
  zhTW: "你的其他聖騎士法術的命中（包括濺射）會額外造成30%的神聖傷害。審判則改為提高50%傷害。奉獻、懲罰光環和命令聖印不受影響。"
- id: hoa.ui.glue.hits_harder_for_each_stack_of_bleed
  enUS: Hits harder for each stack of Bleed
  zhCN: 目标的流血层数越多，伤害越高
  zhTW: "目標的流血層數越多，傷害越高"
- id: hoa.ui.glue.hits_harder_the_bigger_your_shield
  enUS: Hits harder the bigger your Shield
  zhCN: 护盾越大，伤害越高
  zhTW: "護盾越大，傷害越高"
- id: hoa.ui.glue.holds_up_to_3_lightning_charges_gaining_1_every_1_5_sec_ever
  enUS: Holds up to 3 lightning charges, gaining 1 every 1.5 sec. Every 1.5 sec, zaps 1 enemy within 10 yards per charge for Nature damage, applying 1 stack of Static. An enemy that strikes you spends a charge and is zapped. Each zap shields you for 0.5% of your maximum health, up to 5%.
  zhCN: 最多持有3层闪电充能，每1.5秒获得1层。每1.5秒，每层充能电击10码内的1个敌人，造成自然伤害并施加1层静电。攻击你的敌人会消耗一层充能并被电击。每次电击为你提供可吸收0.5%最大生命值的护盾，最多5%。
  zhTW: "最多持有3層閃電充能，每1.5秒獲得1層。每1.5秒，每層充能電擊10碼內的1個敵人，造成自然傷害並施加1層靜電。攻擊你的敵人會消耗一層充能並被電擊。每次電擊為你提供可吸收0.5%最大生命值的護盾，最多5%。"
