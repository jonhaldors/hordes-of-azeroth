  enUS: Binds the strongest enemy nearby, elites first, for 2 sec. It takes Holy damage when bound and every sec while bound. Bosses and mini-bosses cannot be bound but still take the first hit.
  zhCN: 束缚附近最强的敌人，优先选择精英，持续2秒。敌人被束缚时以及束缚期间每秒受到神圣伤害。首领和小首领无法被束缚，但仍会受到初次打击。
