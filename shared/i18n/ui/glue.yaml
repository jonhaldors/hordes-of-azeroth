  enUS: Slams all enemies within 6 yards of you for damage, 2% more for each 1% of your maximum health in your Shield, up to 200% more.
  zhCN: 猛击你6码内的所有敌人，造成伤害，你的护盾每相当于1%最大生命值，伤害提高2%，最多提高200%。
  zhTW: "猛擊你6碼內的所有敵人，造成傷害，你的護盾每相當於1%最大生命值，傷害提高2%，最多提高200%。"
- id: hoa.ui.glue.slams_the_3_strongest_enemies_within_20_yards_for_holy_damag
  enUS: Slams the 3 strongest enemies within 20 yards for Holy damage, with double critical strike chance. With Seal of Righteousness it deals 50% more damage, with Seal of Command it also hits enemies within 5 yards of each target for half, and with Seal of Light it heals you for 1% of your maximum health per enemy hit, up to 5%.
  zhCN: 猛击20码内最强的3个敌人，造成神圣伤害，致命一击几率翻倍。正义圣印使其伤害提高50%；命令圣印还会以一半伤害命中每个目标5码内的敌人；光明圣印每命中一个敌人为你恢复1%最大生命值，最多5%。
  zhTW: "猛擊20碼內最強的3個敵人，造成神聖傷害，致命一擊機率翻倍。正義聖印使其傷害提高50%；命令聖印還會以一半傷害命中每個目標5碼內的敵人；光明聖印每命中一個敵人為你恢復1%最大生命值，最多5%。"
- id: hoa.ui.glue.slams_the_3_strongest_enemies_within_20_yards_with_a_hammer_
  enUS: 'Slams the 3 strongest enemies within 20 yards with a hammer of light for Holy damage, with double critical strike chance. Releases your Seals: Righteousness adds 50% damage, Command hits enemies within 5 yards of each target for half, Light heals you for 1% of your maximum health per enemy hit.'
  zhCN: 以圣光之锤猛击20码内最强的3个敌人，造成神圣伤害，致命一击几率翻倍。同时释放你的圣印：正义圣印额外造成50%伤害，命令圣印对每个目标5码内的敌人造成一半伤害，光明圣印每命中一个敌人为你恢复1%最大生命值。
  zhTW: "以聖光之錘猛擊20碼內最強的3個敵人，造成神聖傷害，致命一擊機率翻倍。同時釋放你的聖印：正義聖印額外造成50%傷害，命令聖印對每個目標5碼內的敵人造成一半傷害，光明聖印每命中一個敵人為你恢復1%最大生命值。"
