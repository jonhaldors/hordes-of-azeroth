- id: hoa.ui.glue.fire_rains_on_the_largest_group
  enUS: Fire rains on the largest group
  zhCN: 火焰倾泻在最大的敌群上
  zhTW: "火焰傾瀉在最大的敵群上"
- id: hoa.ui.glue.fire_that_leaves_enemies_burning
  enUS: Fire that leaves enemies Burning
  zhCN: 使敌人燃烧的火焰
  zhTW: "使敵人燃燒的火焰"
- id: hoa.ui.glue.fireball
  enUS: Fireball
  zhCN: 火球术
  zhTW: "火球術"
- id: hoa.ui.glue.fires_3_holy_bolts_at_the_enemies_that_struck_you_in_the_las
  enUS: Fires 3 holy bolts at the enemies that struck you in the last 5 sec, or else the nearest enemies, each dealing Holy damage and healing you for 0.5% of your maximum health. Healing past full health becomes a Shield, up to 6% of your maximum health.
  zhCN: 向过去5秒内攻击过你的敌人发射3枚神圣箭；若没有这样的敌人，则射向最近的敌人，每枚造成神圣伤害并为你恢复0.5%最大生命值。超出满生命值的治疗会转化为护盾，最多为最大生命值的6%。
  zhTW: "向過去5秒內攻擊過你的敵人發射3枚神聖箭；若沒有這樣的敵人，則射向最近的敵人，每枚造成神聖傷害併為你恢復0.5%最大生命值。超出滿生命值的治療會轉化為護盾，最多為最大生命值的6%。"
- id: hoa.ui.glue.fires_3_holy_bolts_at_the_enemies_that_struck_you_last_or_th
  enUS: Fires 3 holy bolts at the enemies that struck you last, or the nearest enemies, each dealing Holy damage and healing you for 0.5% of your maximum health. Healing past full health becomes Shield.
  zhCN: 向最近攻击过你的敌人发射3枚神圣箭，若没有则射向最近的敌人，每枚造成神圣伤害并为你恢复0.5%最大生命值。溢出满生命值的治疗会转化为护盾。
  zhTW: "向最近攻擊過你的敵人發射3枚神聖箭，若沒有則射向最近的敵人，每枚造成神聖傷害併為你恢復0.5%最大生命值。溢位滿生命值的治療會轉化為護盾。"
- id: hoa.ui.glue.fires_6_arrows_in_a_cone_in_front_of_you_dealing_damage
  enUS: Fires 6 arrows in a cone in front of you, dealing damage.
  zhCN: 向前方锥形范围内射出6支箭，造成伤害。
  zhTW: "向前方錐形範圍內射出6支箭，造成傷害。"
- id: hoa.ui.glue.fires_a_shadow_bolt_at_the_nearest_enemy_dealing_damage_nigh
  enUS: 'Fires a Shadow Bolt at the nearest enemy, dealing damage. Nightfall: enemies that die with your afflictions on them fire a free bolt, at most 1 a sec.'
  zhCN: 向最近的敌人射出一发暗影箭，造成伤害。夜幕：身上带有你的持续伤害效果而死亡的敌人会触发一发免费暗影箭，每秒至多1发。
  zhTW: "向最近的敵人射出一發暗影箭，造成傷害。夜幕：身上帶有你的持續傷害效果而死亡的敵人會觸發一發免費暗影箭，每秒至多1發。"
- id: hoa.ui.glue.fires_a_shadow_bolt_at_the_nearest_enemy_dealing_shadow_dama
  enUS: 'Fires a Shadow Bolt at the nearest enemy, dealing Shadow damage, 4% more per stack of Decay on the target, up to 30 stacks. Nightfall: enemies that die with Decay, Agony or Burning on them fire a free Shadow Bolt at the nearest enemy, at most 1 per sec.'
  zhCN: 向最近的敌人射出一发暗影箭，造成暗影伤害，目标身上每层腐朽使伤害提高4%，最多30层。夜幕：身上带有腐朽、痛苦或燃烧而死亡的敌人会向最近的敌人发射一发免费暗影箭，每秒至多1发。
  zhTW: "向最近的敵人射出一發暗影箭，造成暗影傷害，目標身上每層腐朽使傷害提高4%，最多30層。夜幕：身上帶有腐朽、痛苦或燃燒而死亡的敵人會向最近的敵人發射一發免費暗影箭，每秒至多1發。"
- id: hoa.ui.glue.fires_a_shot_that_pierces_every_enemy_in_a_line_dealing_dama
  enUS: Fires a shot that pierces every enemy in a line, dealing damage. Aims at the Marked group, or else the largest group.
  zhCN: 发射一发贯穿直线上所有敌人的射击，造成伤害。优先瞄准被标记的敌群，其次瞄准最大的敌群。
  zhTW: "發射一發貫穿直線上所有敵人的射擊，造成傷害。優先瞄準被標記的敵群，其次瞄準最大的敵群。"
- id: hoa.ui.glue.fires_a_shot_that_pierces_every_enemy_in_a_line_dealing_dama_2
  enUS: Fires a shot that pierces every enemy in a line, dealing damage. Aims at the Marked group, or else the largest group. With an Explosive Arrow loaded, the shot explodes on its first hit, dealing its damage to all enemies within 8 yards.
  zhCN: 发射一发贯穿直线上所有敌人的射击，造成伤害。优先瞄准被标记的敌群，其次瞄准最大的敌群。装填爆炸箭时，该射击会在首次命中时爆炸，对8码内的所有敌人造成其伤害。
  zhTW: "發射一發貫穿直線上所有敵人的射擊，造成傷害。優先瞄準被標記的敵群，其次瞄準最大的敵群。裝填爆炸箭時，該射擊會在首次命中時爆炸，對8碼內的所有敵人造成其傷害。"
