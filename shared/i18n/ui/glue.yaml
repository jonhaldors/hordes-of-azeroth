  zhTW: "荊棘谷"
- id: hoa.ui.glue.strikes_3_enemies_and_heals_you
  enUS: Strikes 3 enemies and heals you
  zhCN: 打击3个敌人并为你恢复生命
  zhTW: "打擊3個敵人併為你恢復生命"
- id: hoa.ui.glue.strikes_8_times_over_1_4_sec_each_strike_hitting_a_random_en
  enUS: Strikes 8 times over 1.4 sec, each strike hitting a random enemy within 10 yards for damage and carrying your poisons and openers. Each strike reduces the cooldown of Eviscerate by 0.5 sec.
  zhCN: 在1.4秒内攻击8次，每次随机命中10码内的一个敌人，造成伤害并附带你的毒药和起手技。每次攻击使剔骨的冷却时间缩短0.5秒。
  zhTW: "在1.4秒內攻擊8次，每次隨機命中10碼內的一個敵人，造成傷害並附帶你的毒藥和起手技。每次攻擊使剔骨的冷卻時間縮短0.5秒。"
- id: hoa.ui.glue.strikes_8_times_over_2_sec_each_strike_hitting_a_random_enem
  enUS: Strikes 8 times over 2 sec, each strike hitting a random enemy within 10 yards for damage and carrying your poisons and openers.
  zhCN: 在2秒内连续攻击8次，每次攻击随机命中10码内的一个敌人，造成伤害并附带你的毒药和起手技。
  zhTW: "在2秒內連續攻擊8次，每次攻擊隨機命中10碼內的一個敵人，造成傷害並附帶你的毒藥和起手技。"
- id: hoa.ui.glue.strikes_all_enemies_within_10_yards_of_you
  enUS: Strikes all enemies within 10 yards of you.
  zhCN: 打击你10码内的所有敌人。
  zhTW: "打擊你10碼內的所有敵人。"
- id: hoa.ui.glue.strikes_all_enemies_within_10_yards_of_you_dealing_8_more_da
  enUS: Strikes all enemies within 10 yards of you, dealing 8% more damage per stack of Bleed on the target, up to 30 stacks. Bleeding enemies also take the damage their Bleed would deal over the next 2 sec, keeping their stacks.
  zhCN: 打击你10码内的所有敌人，目标每层流血使伤害提高8%，最多计算30层。流血状态的敌人还会立即承受其流血在未来2秒内本应造成的伤害，并保留层数。
  zhTW: "打擊你10碼內的所有敵人，目標每層流血使傷害提高8%，最多計算30層。流血狀態的敵人還會立即承受其流血在未來2秒內本應造成的傷害，並保留層數。"
- id: hoa.ui.glue.strikes_all_enemies_within_10_yards_of_you_normal_enemies_be
  enUS: Strikes all enemies within 10 yards of you. Normal enemies below 20% health die instantly; elites and bosses below 20% take triple damage. Its kills Enrage you, granting 25% Haste for 4 sec.
  zhCN: 打击你10码内的所有敌人。生命值低于20%的普通敌人立即死亡；生命值低于20%的精英和首领受到三倍伤害。其击杀会使你进入狂怒状态：急速提高25%，持续4秒。
  zhTW: "打擊你10碼內的所有敵人。生命值低於20%的普通敵人立即死亡；生命值低於20%的精英和首領受到三倍傷害。其擊殺會使你進入狂怒狀態：急速提高25%，持續4秒。"
- id: hoa.ui.glue.strikes_all_enemies_within_8_yards_of_you_for_damage
  enUS: Strikes all enemies within 8 yards of you for damage.
  zhCN: 打击你8码内的所有敌人，造成伤害。
  zhTW: "打擊你8碼內的所有敵人，造成傷害。"
- id: hoa.ui.glue.strikes_all_enemies_within_8_yards_of_you_for_damage_8_more_
  enUS: Strikes all enemies within 8 yards of you for damage, 8% more per stack of Bleed on the target, up to 30 stacks.
  zhCN: 打击你8码内的所有敌人，造成伤害，目标每层流血使伤害提高8%，最多计算30层。
  zhTW: "打擊你8碼內的所有敵人，造成傷害，目標每層流血使傷害提高8%，最多計算30層。"
- id: hoa.ui.glue.strikes_all_enemies_within_8_yards_of_you_for_damage_normal_
  enUS: 'Strikes all enemies within 8 yards of you for damage. Normal enemies below 20% health die instantly; elites and bosses below 20% take triple damage. Kills Enrage you: 25% Haste for 4 sec.'
  zhCN: 打击你8码内的所有敌人，造成伤害。生命值低于20%的普通敌人立即死亡；生命值低于20%的精英和首领受到三倍伤害。击杀会使你进入狂怒状态：急速提高25%，持续4秒。
  zhTW: "打擊你8碼內的所有敵人，造成傷害。生命值低於20%的普通敵人立即死亡；生命值低於20%的精英和首領受到三倍傷害。擊殺會使你進入狂怒狀態：急速提高25%，持續4秒。"
- id: hoa.ui.glue.strikes_back_when_you_are_hit
  enUS: Strikes back when you are hit
  zhCN: 受到攻击时进行反击
  zhTW: "受到攻擊時進行反擊"
- id: hoa.ui.glue.strikes_every_enemy_within_10_yards
  enUS: Strikes every enemy within 10 yards
  zhCN: 打击10码内的所有敌人
  zhTW: "打擊10碼內的所有敵人"
- id: hoa.ui.glue.strikes_every_enemy_within_8_yards
  enUS: Strikes every enemy within 8 yards
  zhCN: 打击8码内的所有敌人
  zhTW: "打擊8碼內的所有敵人"
- id: hoa.ui.glue.strikes_the_2_nearest_enemies_with_fire_dealing_damage_and_a
  enUS: Strikes the 2 nearest enemies with fire, dealing damage and applying 2 stacks of Burning.
  zhCN: 以火焰打击最近的2个敌人，造成伤害并施加2层燃烧。
  zhTW: "以火焰打擊最近的2個敵人，造成傷害並施加2層燃燒。"
- id: hoa.ui.glue.strikes_the_3_enemies_with_the_most_poison_within_20_yards_f
  enUS: Strikes the 3 enemies with the most Poison within 20 yards for Nature damage plus all the damage their Poison would still deal, without removing it. For 5 sec, your hits apply 2 additional stacks of Poison.
  zhCN: 打击20码内中毒层数最多的3个敌人，造成自然伤害，并附加其中毒本应继续造成的全部伤害，但不消耗中毒层数。在5秒内，你的命中会额外施加2层中毒。
  zhTW: "打擊20碼內中毒層數最多的3個敵人，造成自然傷害，並附加其中毒本應繼續造成的全部傷害，但不消耗中毒層數。在5秒內，你的命中會額外施加2層中毒。"
- id: hoa.ui.glue.strikes_the_3_most_poisoned_enemies
  enUS: Strikes the 3 most poisoned enemies
  zhCN: 打击中毒最深的3个敌人
  zhTW: "打擊中毒最深的3個敵人"
- id: hoa.ui.glue.strikes_the_3_nearest_enemies_within_10_yards_and_heals_you_
  enUS: Strikes the 3 nearest enemies within 10 yards and heals you for 0.5% of your maximum health per enemy hit, up to 2.5%. Its critical strikes Enrage you, granting 25% Haste for 4 sec.
  zhCN: 打击10码内最近的3个敌人，并每命中一个敌人为你恢复0.5%最大生命值，最多2.5%。其致命一击会使你进入狂怒状态：急速提高25%，持续4秒。
  zhTW: "打擊10碼內最近的3個敵人，並每命中一個敵人為你恢復0.5%最大生命值，最多2.5%。其致命一擊會使你進入狂怒狀態：急速提高25%，持續4秒。"
- id: hoa.ui.glue.strikes_the_3_nearest_enemies_within_8_yards_for_damage_and_
  enUS: 'Strikes the 3 nearest enemies within 8 yards for damage and heals you for 0.5% of your maximum health per enemy hit, up to 2.5%. Critical strikes Enrage you: 25% Haste for 4 sec.'
  zhCN: 打击你8码内最近的3个敌人，造成伤害，并每命中一个敌人为你恢复0.5%最大生命值，最多2.5%。致命一击会使你进入狂怒状态：急速提高25%，持续4秒。
  zhTW: "打擊你8碼內最近的3個敵人，造成傷害，並每命中一個敵人為你恢復0.5%最大生命值，最多2.5%。致命一擊會使你進入狂怒狀態：急速提高25%，持續4秒。"
- id: hoa.ui.glue.strikes_the_enemy_with_the_most_bleed_stacks
  enUS: Strikes the enemy with the most Bleed stacks
  zhCN: 打击流血层数最多的敌人
  zhTW: "打擊流血層數最多的敵人"
- id: hoa.ui.glue.strikes_the_enemy_with_the_most_poison_for_nature_damage_and
  enUS: Strikes the enemy with the most Poison for Nature damage, and your hits apply 2 more stacks of Poison for 5 sec.
  zhCN: 打击中毒层数最多的敌人，造成自然伤害，并使你的攻击在5秒内额外施加2层中毒。
  zhTW: "打擊中毒層數最多的敵人，造成自然傷害，並使你的攻擊在5秒內額外施加2層中毒。"
- id: hoa.ui.glue.strikes_the_most_poisoned_enemy
  enUS: Strikes the most poisoned enemy
  zhCN: 打击中毒最深的敌人
  zhTW: "打擊中毒最深的敵人"
- id: hoa.ui.glue.strikes_the_nearest_enemy_for_heavy_damage_and_30_of_it_to_e
  enUS: Strikes the nearest enemy for heavy damage and 30% of it to enemies within 5 yards of the target.
  zhCN: 打击最近的敌人，造成高额伤害，并对目标5码内的敌人造成30%的伤害。
  zhTW: "打擊最近的敵人，造成高額傷害，並對目標5碼內的敵人造成30%的傷害。"
- id: hoa.ui.glue.strikes_the_nearest_enemy_within_12_yards_twice_with_weapon_
  enUS: Strikes the nearest enemy within 12 yards twice, with weapon and lightning, applying 2 stacks of Static and 2 stacks of Nature Vulnerability. Counts as 2 hits for Maelstrom Weapon.
  zhCN: 以武器和闪电双重打击12码内最近的敌人两次，施加2层静电和2层自然易伤。计为漩涡武器的2次命中。
  zhTW: "以武器和閃電雙重打擊12碼內最近的敵人兩次，施加2層靜電和2層自然易傷。計為漩渦武器的2次命中。"
- id: hoa.ui.glue.strikes_the_nearest_enemy_within_12_yards_twice_with_weapon__2
  enUS: Strikes the nearest enemy within 12 yards twice, with weapon and lightning, for damage, applying 2 stacks of Static and 2 stacks of Nature Vulnerability.
  zhCN: 以武器和闪电双重打击12码内最近的敌人，造成伤害，施加2层静电和2层自然易伤。
  zhTW: "以武器和閃電雙重打擊12碼內最近的敵人，造成傷害，施加2層靜電和2層自然易傷。"
- id: hoa.ui.glue.strikes_the_strongest_enemy_within_30_yards_for_heavy_holy_d
  enUS: Strikes the strongest enemy within 30 yards for heavy Holy damage. Undead and Demons take triple damage, elites and bosses double. Critical strikes from your other Paladin spells reset its cooldown, at most once a sec.
  zhCN: 打击30码内最强的敌人，造成高额神圣伤害。亡灵和恶魔受到三倍伤害，精英和首领受到两倍伤害。你的其他圣骑士法术造成致命一击时，会重置此法术的冷却时间，每秒至多一次。
  zhTW: "打擊30碼內最強的敵人，造成高額神聖傷害。亡靈和惡魔受到三倍傷害，精英和首領受到兩倍傷害。你的其他聖騎士法術造成致命一擊時，會重置此法術的冷卻時間，每秒至多一次。"
- id: hoa.ui.glue.strikes_the_strongest_enemy_within_30_yards_for_holy_damage_
  enUS: Strikes the strongest enemy within 30 yards for Holy damage and binds it for 2 sec, dealing Holy damage every sec while bound. Bosses and mini-bosses are struck first but cannot be bound.
  zhCN: 打击30码内最强的敌人，造成神圣伤害并将其束缚2秒，束缚期间每秒造成神圣伤害。首领和小首领会被优先打击，但无法被束缚。
  zhTW: "打擊30碼內最強的敵人，造成神聖傷害並將其束縛2秒，束縛期間每秒造成神聖傷害。首領和小首領會被優先打擊，但無法被束縛。"
- id: hoa.ui.glue.strikes_up_to_6_enemies_in_a_cone
  enUS: Strikes up to 6 enemies in a cone
  zhCN: 打击锥形范围内的最多6个敌人
  zhTW: "打擊錐形範圍內的最多6個敵人"
- id: hoa.ui.glue.strikes_up_to_6_enemies_within_18_yards_in_a_cone_toward_the
  enUS: Strikes up to 6 enemies within 18 yards in a cone toward the nearest enemy.
  zhCN: 朝最近的敌人方向，打击18码锥形范围内的最多6个敌人。
  zhTW: "朝最近的敵人方向，打擊18碼錐形範圍內的最多6個敵人。"
- id: hoa.ui.glue.stuns_the_strongest_enemy
  enUS: Stuns the strongest enemy
  zhCN: 使最强的敌人昏迷
  zhTW: "使最強的敵人昏迷"
- id: hoa.ui.glue.subtlety
  enUS: Subtlety
  zhCN: 敏锐
  zhTW: "敏銳"
- id: hoa.ui.glue.succubus
  enUS: Succubus
  zhCN: 魅魔
  zhTW: "魅魔"
- id: hoa.ui.glue.summon_elemental
  enUS: Summon Elemental
  zhCN: 召唤元素
  zhTW: "召喚元素"
- id: hoa.ui.glue.summons_2_spirit_wolves_whose_bites_apply_1_stack_of_static_
  enUS: Summons 2 spirit wolves whose bites apply 1 stack of Static. Every 3 sec, each wolf cleaves all enemies in front of it within 6 yards.
  zhCN: 召唤2头灵魂之狼，它们的撕咬会施加1层静电。每3秒，每头狼会顺劈其前方6码内的所有敌人。
  zhTW: "召喚2頭靈魂之狼，它們的撕咬會施加1層靜電。每3秒，每頭狼會順劈其前方6碼內的所有敵人。"
- id: hoa.ui.glue.summons_2_spirit_wolves_whose_bites_apply_static
  enUS: Summons 2 spirit wolves whose bites apply Static.
  zhCN: 召唤2头灵魂之狼，它们的撕咬会施加静电。
  zhTW: "召喚2頭靈魂之狼，它們的撕咬會施加靜電。"
- id: hoa.ui.glue.summons_2_treants_their_attacks_apply_moonfire_and_every_6_s
  enUS: Summons 2 Treants. Their attacks apply Moonfire, and every 6 sec they root their target and nearby enemies for 2 sec. Empowered in Tree of Life, which calls 1 additional Treant.
  zhCN: 召唤2个树人。它们的攻击会施加月火术，并每6秒定身其目标及附近敌人2秒。生命之树形态下获得强化，并额外召唤1个树人。
  zhTW: "召喚2個樹人。它們的攻擊會施加月火術，並每6秒定身其目標及附近敵人2秒。生命之樹形態下獲得強化，並額外召喚1個樹人。"
- id: hoa.ui.glue.summons_2_treants_whose_attacks_apply_1_stack_of_moonfire_ev
  enUS: Summons 2 Treants whose attacks apply 1 stack of Moonfire. Every 6 sec, each Treant roots its target and normal enemies within 5 yards for 2 sec. Empowered in Tree of Life, which calls 1 additional Treant.
  zhCN: 召唤2个树人，它们的攻击会施加1层月火术。每6秒，每个树人定身其目标及5码内的普通敌人2秒。生命之树形态下获得强化，并额外召唤1个树人。
  zhTW: "召喚2個樹人，它們的攻擊會施加1層月火術。每6秒，每個樹人定身其目標及5碼內的普通敵人2秒。生命之樹形態下獲得強化，並額外召喚1個樹人。"
- id: hoa.ui.glue.summons_a_cat_that_fights_for_you_its_attacks_apply_1_stack_
  enUS: Summons a cat that fights for you. Its attacks apply 1 stack of Bleed, its Claw applies 4 stacks, and its Swipe strikes all enemies in front of it.
  zhCN: 召唤一只猫为你而战。它的攻击施加1层流血，爪击施加4层，横扫则命中其前方的所有敌人。
  zhTW: "召喚一隻貓為你而戰。它的攻擊施加1層流血，爪擊施加4層，橫掃則命中其前方的所有敵人。"
- id: hoa.ui.glue.summons_a_felhunter_whose_shadow_bite_deals_10_more_damage_p
  enUS: Summons a Felhunter whose Shadow Bite deals 10% more damage per affliction on the target and interrupts spells, and whose Shadow Cleave hits every enemy in front of it. Every 10 sec it removes a harmful effect from you.
  zhCN: 召唤一只恶魔猎犬，其暗影撕咬的伤害随目标身上的每个持续伤害效果提高10%，并可打断施法；其暗影顺劈斩会命中前方的所有敌人。每10秒，它会移除你身上的一个有害效果。
  zhTW: "召喚一隻惡魔獵犬，其暗影撕咬的傷害隨目標身上的每個持續傷害效果提高10%，並可打斷施法；其暗影順劈斬會命中前方的所有敵人。每10秒，它會移除你身上的一個有害效果。"
- id: hoa.ui.glue.summons_a_shadowfiend_whose_attacks_apply_decay_and_heal_you
  enUS: Summons a Shadowfiend whose attacks apply Decay and heal you for 0.5% of your maximum health.
  zhCN: 召唤一只暗影魔，其攻击会施加腐朽，并为你恢复0.5%最大生命值。
  zhTW: "召喚一隻暗影魔，其攻擊會施加腐朽，併為你恢復0.5%最大生命值。"
- id: hoa.ui.glue.summons_a_shadowfiend_whose_attacks_apply_decay_and_whose_sh
  enUS: Summons a Shadowfiend whose attacks apply Decay and whose Shadow Cleave hits every enemy in front of it. Its melee attacks heal you for 0.5% of your maximum health.
  zhCN: 召唤一只暗影魔，其攻击会施加腐朽，其暗影顺劈会命中前方的所有敌人。它的近战攻击为你恢复0.5%最大生命值。
  zhTW: "召喚一隻暗影魔，其攻擊會施加腐朽，其暗影順劈會命中前方的所有敵人。它的近戰攻擊為你恢復0.5%最大生命值。"
- id: hoa.ui.glue.summons_a_succubus_whose_lash_of_pain_strikes_all_enemies_in
  enUS: Summons a Succubus whose Lash of Pain strikes all enemies in a wide arc in front of her and applies Shadow Vulnerability.
  zhCN: 召唤一个魅魔，她的痛苦之鞭会打击她前方宽广弧线范围内的所有敌人，并施加暗影易伤。
  zhTW: "召喚一個魅魔，她的痛苦之鞭會打擊她前方寬廣弧線範圍內的所有敵人，並施加暗影易傷。"
- id: hoa.ui.glue.summons_a_voidwalker_that_consumes_enemies_dying_near_it_aft
  enUS: Summons a Voidwalker that consumes enemies dying near it. After 8 it bursts in a void nova that hits every enemy around it.
  zhCN: 召唤一个虚空行者，吞噬其附近死亡的敌人。吞噬8个后，它会以虚空新星爆发，击中周围的所有敌人。
  zhTW: "召喚一個虛空行者，吞噬其附近死亡的敵人。吞噬8個後，它會以虛空新星爆發，擊中周圍的所有敵人。"
- id: hoa.ui.glue.summons_a_voidwalker_that_consumes_enemies_dying_near_it_aft_2
  enUS: Summons a Voidwalker that consumes enemies dying near it. After consuming 8, it bursts in a void nova that hits all nearby enemies.
  zhCN: 召唤一个虚空行者，吞噬其附近死亡的敌人。吞噬8个后，它会以虚空新星爆发，命中附近的所有敌人。
  zhTW: "召喚一個虛空行者，吞噬其附近死亡的敵人。吞噬8個後，它會以虛空新星爆發，命中附近的所有敵人。"
- id: hoa.ui.glue.summons_an_elemental_of_your_main_spell_school_to_fight_for_
