  enUS: A spirit wolf fights for you, biting for damage. Every 15 sec it howls, and your other pets deal double damage to all enemies in front for 6 sec.
  zhCN: 一只灵魂之狼为你而战，撕咬造成伤害。它会每隔15秒嚎叫一次，使你的其他宠物对前方所有敌人造成的伤害翻倍，持续6秒。
  zhTW: "一隻靈魂之狼為你而戰，撕咬造成傷害。它會每隔15秒嚎叫一次，使你的其他寵物對前方所有敵人造成的傷害翻倍，持續6秒。"
- id: hoa.ui.glue.a_spirit_wolf_fights_for_you_every_15_sec_it_howls_and_for_6
  enUS: A spirit wolf fights for you. Every 15 sec it howls, and for 6 sec your other pets deal double damage and their bites also strike all enemies in front of them. Your pets' bites apply Hunter's Mark.
  zhCN: 一头灵魂之狼为你而战。它每15秒发出一次嚎叫，持续6秒，使你的其他宠物造成双倍伤害，且它们的撕咬还会命中其前方的所有敌人。你的宠物的撕咬会施加猎人印记。
  zhTW: "一頭靈魂之狼為你而戰。它每15秒發出一次嚎叫，持續6秒，使你的其他寵物造成雙倍傷害，且它們的撕咬還會命中其前方的所有敵人。你的寵物的撕咬會施加獵人印記。"
