  zhCN: 在你周围爆发、可治疗你的圣光
  zhTW: "在你周圍爆發、可治療你的聖光"
- id: hoa.ui.glue.holy_ground_and_auras_burn_whoever_comes_close_while_divine_
  enUS: Holy ground and auras burn whoever comes close, while Divine Shield blocks the big hits.
  zhCN: 圣洁的大地与光环灼烧一切靠近的敌人，圣盾术则抵挡致命的重击。
  zhTW: "聖潔的大地與光環灼燒一切靠近的敵人，聖盾術則抵擋致命的重擊。"
- id: hoa.ui.glue.holy_ground_that_burns_enemies_on_it
  enUS: Holy ground that burns enemies on it
  zhCN: 灼烧其上敌人的圣洁大地
  zhTW: "灼燒其上敵人的聖潔大地"
- id: hoa.ui.glue.holy_light_bursts_around_you_dealing_holy_damage_to_all_enem
  enUS: Holy light bursts around you, dealing Holy damage to all enemies within 10 yards and healing you for 0.5% of your maximum health per enemy hit, up to 3%. Each enemy hit counts as a strike for Seal of Command, up to 5 bursts.
  zhCN: 圣光在你周围爆发，对10码内的所有敌人造成神圣伤害，并每命中一个敌人为你恢复0.5%最大生命值，最多3%。每次命中的敌人都算作命令圣印的一次打击，最多5次爆发。
  zhTW: "聖光在你周圍爆發，對10碼內的所有敵人造成神聖傷害，並每命中一個敵人為你恢復0.5%最大生命值，最多3%。每次命中的敵人都算作命令聖印的一次打擊，最多5次爆發。"
- id: hoa.ui.glue.holy_light_bursts_around_you_dealing_holy_damage_to_every_en
  enUS: Holy light bursts around you, dealing Holy damage to every enemy within 10 yards and healing you for 0.5% of your maximum health per enemy hit, up to 3%.
  zhCN: 圣光在你周围爆发，对10码内的所有敌人造成神圣伤害，并每命中一个敌人为你恢复0.5%最大生命值，最多3%。
  zhTW: "聖光在你周圍爆發，對10碼內的所有敵人造成神聖傷害，並每命中一個敵人為你恢復0.5%最大生命值，最多3%。"
- id: hoa.ui.glue.holy_strikes_from_afar_exorcism_falling_hammers_and_light_th
  enUS: 'Holy strikes from afar: Exorcism, falling hammers and light that heals with every strike.'
  zhCN: 远程神圣打击：驱邪术、从天而降的战锤，以及每次打击都能治疗你的圣光。
  zhTW: "遠端神聖打擊：驅邪術、從天而降的戰錘，以及每次打擊都能治療你的聖光。"
