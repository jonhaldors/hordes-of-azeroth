  legacy_server_id: 459
  enUS: 20 Armor reduces damage taken by 16%, 100 Armor by 43%, and 300 Armor by 60%, the most it can. Each point above 300 gives +0.5% maximum health.
  zhCN: 20点护甲使受到的伤害降低16%，100点护甲降低43%，300点护甲降低60%，此为上限。超过300的每点护甲提供+0.5%最大生命值。
