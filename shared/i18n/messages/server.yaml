- id: hoa.msg.rule_stacking_total
  legacy_server_id: 469
  enUS: Stats from gear, cards, glyphs, passives, talents, Training and Ley Lines add together. Caps apply to the total.
  zhCN: 来自装备、卡片、雕文、被动技能、天赋、训练和魔网的属性会相加。上限作用于总值。
  zhTW: "來自裝備、卡片、雕文、被動技能、天賦、訓練和魔網的屬性會相加。上限作用於總值。"
- id: hoa.msg.rule_stacking_caps
  legacy_server_id: 470
  enUS: Critical strike chance has no cap.
  zhCN: 致命一击几率没有上限。
  zhTW: "致命一擊機率沒有上限。"
- id: hoa.msg.rule_stacking_power
  legacy_server_id: 471
  enUS: Talent damage bonuses add to Power. Spell ranks, Hunter's Mark, Judged, keyword payoffs and capstones multiply with it.
  zhCN: 天赋的伤害加成计入力量。法术等级、猎人印记、被审判、关键词收益和终极天赋与其相乘。
  zhTW: "天賦的傷害加成計入力量。法術等級、獵人印記、被審判、關鍵詞收益和終極天賦與其相乘。"
- id: hoa.msg.rule_stacking_target
  legacy_server_id: 472
  enUS: Vulnerabilities and Sunder Armor multiply with everything else.
  zhCN: 易伤和破甲与其他所有加成相乘。
  zhTW: "易傷和破甲與其他所有加成相乘。"
- id: hoa.msg.rule_stacking_copies
  legacy_server_id: 473
  enUS: Each passive rank, extra card copy and Ley Line blessing of the same stat is worth 85% of the one before, never below 10%. Count always adds in full, and Rested can drop below 10%.
  zhCN: 同一属性的被动技能每一级、每多一张相同的卡片和每个魔网祝福，效果为前一个的85%，但不低于10%。数量始终全额累加，而休憩可能低于10%。
  zhTW: "同一屬性的被動技能每一級、每多一張相同的卡片和每個魔網祝福，效果為前一個的85%，但不低於10%。數量始終全額累加，而休憩可能低於10%。"
