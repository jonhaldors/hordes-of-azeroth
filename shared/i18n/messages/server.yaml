  legacy_server_id: 916
  enUS: 'Higher Mythic levels drop gear with a higher Item Level. Each drop''s quality is random: green gear has 1 bonus stat, blue gear has 10% more stats and 1 or 2 bonus stats, and epic gear has 45% more stats than white and at least 1 bonus stat. Legendaries have epic stats and a unique effect. From the same level, an epic always beats a blue; compare gear from different levels by Item Level.'
  zhCN: 史诗等级越高，其掉落装备的物品等级就越高。品质在每次掉落时随机决定：绿色装备有1条额外属性，蓝色装备属性多10%并有1至2条额外属性，史诗装备比白色装备多45%属性，且至少有1条额外属性。传说装备拥有史诗属性和一个独特效果。同一级别下，史诗装备总是胜过蓝色装备；来自不同级别的装备请按物品等级比较。
  zhTW: "史詩等級越高，其掉落裝備的物品等級就越高。品質在每次掉落時隨機決定：綠色裝備有1條額外屬性，藍色裝備屬性多10%並有1至2條額外屬性，史詩裝備比白色裝備多45%屬性，且至少有1條額外屬性。傳說裝備擁有史詩屬性和一個獨特效果。同一級別下，史詩裝備總是勝過藍色裝備；來自不同級別的裝備請按物品等級比較。"
- id: hoa.msg.rule_gear_rolls
  legacy_server_id: 917
  enUS: From Mythic 11, bonus stats roll in the top half of their range; from Mythic 16, in the top quarter.
  zhCN: 从史诗11级起，额外属性会在其范围的上半段内随机；从史诗16级起，则在上四分之一段内随机。
  zhTW: "從史詩11級起，額外屬性會在其範圍的上半段內隨機；從史詩16級起，則在上四分之一段內隨機。"
