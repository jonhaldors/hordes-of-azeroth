  zhTW: "基礎為{1}%。法術的致命一擊造成150%傷害，攻擊造成200%傷害。機率超過100%時，一次命中可以造成兩次致命一擊。達到200%時，每次命中都會造成兩次致命一擊，再高也沒有效果。"
