  zhCN: 吸收最多相当于最大生命值一定比例的伤害。{1}内未受到伤害后重新充满。所有护盾合计最多吸收相当于最大生命值50%的伤害，拥有重装碾压时为100%。
  zhTW: "吸收最多相當於最大生命值一定比例的傷害。{1}內未受到傷害後重新充滿。所有護盾合計最多吸收相當於最大生命值50%的傷害，擁有重灌碾壓時為100%。"
