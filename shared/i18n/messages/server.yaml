- id: hoa.msg.shrine_moonwell_text
  legacy_server_id: 781
  enUS: Click it to heal 8% of your health every second for 10 seconds while you stand in it. Enemies that die inside it give double experience.
  zhCN: 点击它后，站在其中时每秒恢复8%生命值，持续10秒。在其中死亡的敌人提供双倍经验值。
