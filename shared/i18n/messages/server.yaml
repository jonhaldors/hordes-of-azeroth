  zhCN: 双重打击、回响和目标数强化只会来自史诗等级。
  zhTW: "雙重打擊、迴響和目標數強化只會來自史詩等級。"
- id: hoa.msg.rule_evolutions
  legacy_server_id: 480
  enUS: Evolutions can be offered from rank 10, or earlier with Premonition. An evolved spell keeps its rank, damage and upgrades. Blade Flurry, Shadow Dance and Evasion start at max rank; their evolutions can be offered once your other spells total 20 ranks.
  zhCN: 从10级起，升级时可能提供进化；拥有预感时会更早出现。进化后的法术会保留其等级、伤害和强化。剑刃乱舞、暗影之舞和闪避学会时即为最高等级；当你的其他法术总等级达到20级后，才会提供它们的进化。
  zhTW: "從10級起，升級時可能提供進化；擁有預感時會更早出現。進化後的法術會保留其等級、傷害和強化。劍刃亂舞、暗影之舞和閃避學會時即為最高等級；當你的其他法術總等級達到20級後，才會提供它們的進化。"
- id: hoa.msg.rule_hit_spread
  legacy_server_id: 481
  enUS: Spell damage varies by up to 7%, pet damage by up to 10%. Damage over time doesn't vary.
  zhCN: 法术伤害的浮动幅度最多为7%，宠物伤害最多为10%。持续伤害不会浮动。
  zhTW: "法術傷害的浮動幅度最多為7%，寵物傷害最多為10%。持續傷害不會浮動。"
- id: hoa.msg.rule_slots
  legacy_server_id: 482
  enUS: You start with 3 spell slots and 3 passive slots. Sayge sells more, up to 5 spells and 6 passives.
  zhCN: 你初始拥有3个法术槽位和3个被动技能槽位。塞格出售更多槽位，最多5个法术和6个被动技能。
  zhTW: "你初始擁有3個法術槽位和3個被動技能槽位。塞格出售更多槽位，最多5個法術和6個被動技能。"
- id: hoa.msg.term_base_health
  legacy_server_id: 483
  enUS: Base health
  zhCN: 基础生命值
  zhTW: "基礎生命值"
- id: hoa.msg.rule_base_health
  legacy_server_id: 484
  enUS: the health of a normal enemy of the zone's level on Normal. It doesn't grow with difficulty, stages, elites or bosses.
  zhCN: 普通难度下与该区域等级相同的普通敌人的生命值。它不会随难度、阶段、精英或首领而提高。
  zhTW: "普通難度下與該區域等級相同的普通敵人的生命值。它不會隨難度、階段、精英或首領而提高。"
- id: hoa.msg.rule_dot_stacks
  legacy_server_id: 485
  enUS: 'Burning, Bleed, Poison, Decay and Moonfire: each stack deals {1}% of base health every tick for {2}, up to {3} stacks.'
  zhCN: 燃烧、流血、中毒、腐朽和月火术：每层每跳造成基础生命值{1}%的伤害，持续{2}，最多{3}层。
  zhTW: "燃燒、流血、中毒、腐朽和月火術：每層每跳造成基礎生命值{1}%的傷害，持續{2}，最多{3}層。"
  placeholders:
  - 1
  - 2
  - 3
- id: hoa.msg.term_agony
  legacy_server_id: 486
  enUS: Agony
  zhCN: 痛苦
  zhTW: "痛苦"
- id: hoa.msg.rule_agony
  legacy_server_id: 487
  enUS: each stack deals {1}% of base health every tick for {2}, growing to 3 times as strong over 8 ticks. It doesn't spread on death.
  zhCN: 每层每跳造成基础生命值{1}%的伤害，持续{2}，并在8跳内逐渐增强至3倍。目标死亡时不会蔓延。
  zhTW: "每層每跳造成基礎生命值{1}%的傷害，持續{2}，並在8跳內逐漸增強至3倍。目標死亡時不會蔓延。"
  placeholders:
  - 1
  - 2
- id: hoa.msg.rule_dot_tick
  legacy_server_id: 488
  enUS: Damage over time ticks every second, faster with Haste.
  zhCN: 持续伤害每秒跳动一次，急速可使其更快。
  zhTW: "持續傷害每秒跳動一次，急速可使其更快。"
- id: hoa.msg.rule_dot_crit
  legacy_server_id: 489
  enUS: Damage over time can critically strike only with a talent, for half the usual critical strike bonus.
  zhCN: 只有拥有相应天赋时，持续伤害才能造成致命一击，且致命一击的伤害加成只有通常的一半。
  zhTW: "只有擁有相應天賦時，持續傷害才能造成致命一擊，且致命一擊的傷害加成只有通常的一半。"
- id: hoa.msg.rule_dot_refresh
  legacy_server_id: 490
  enUS: Each new stack refreshes all stacks on that enemy.
  zhCN: 每叠加新的一层，都会刷新该敌人身上的所有层数。
  zhTW: "每疊加新的一層，都會重新整理該敵人身上的所有層數。"
- id: hoa.msg.rule_dot_power
  legacy_server_id: 491
  enUS: Damage over time updates with your Power when a stack is added or expires. Vulnerabilities apply to every tick.
  zhCN: 持续伤害在层数增加或消失时会按你的力量更新。易伤效果对每一跳生效。
  zhTW: "持續傷害在層數增加或消失時會按你的力量更新。易傷效果對每一跳生效。"
- id: hoa.msg.rule_dot_spread
  legacy_server_id: 492
  enUS: When an enemy with 2 or more stacks dies, half its stacks spread to the 2 nearest enemies within 8 yards.
  zhCN: 拥有2层或以上效果的敌人死亡时，其一半的层数会蔓延至8码内最近的2个敌人。
  zhTW: "擁有2層或以上效果的敵人死亡時，其一半的層數會蔓延至8碼內最近的2個敵人。"
- id: hoa.msg.rule_dot_bosses
  legacy_server_id: 493
  enUS: Stacks deal the same damage to bosses, which is a smaller share of their health.
  zhCN: 首领每层受到的伤害相同，只是占其生命值的比例更小。
  zhTW: "首領每層受到的傷害相同，只是佔其生命值的比例更小。"
- id: hoa.msg.rule_dot_leech
  legacy_server_id: 494
  enUS: Ticks can trigger Leech. They don't trigger cards or trinkets.
  zhCN: 每跳伤害可以触发吸血，但不会触发卡片或饰品。
  zhTW: "每跳傷害可以觸發吸血，但不會觸發卡片或飾品。"
- id: hoa.msg.term_chill
  legacy_server_id: 495
  enUS: Chill
  zhCN: 冰寒
  zhTW: "冰寒"
- id: hoa.msg.rule_chill
  legacy_server_id: 496
  enUS: '{1}% slow per stack, up to {2}. At {2} stacks the enemy is Frozen.'
  zhCN: 每层减速{1}%，最多{2}层。达到{2}层时，敌人会被冻结。
  zhTW: "每層減速{1}%，最多{2}層。達到{2}層時，敵人會被凍結。"
  placeholders:
  - 1
  - 2
- id: hoa.msg.term_frozen
  legacy_server_id: 497
  enUS: Frozen
  zhCN: 冻结
  zhTW: "凍結"
- id: hoa.msg.rule_frozen
  legacy_server_id: 498
  enUS: normal enemies are rooted for {1}; elites and bosses keep moving but count as Frozen. Your Frost spells always crit Frozen enemies, and you deal +50% critical strike damage to them.
  zhCN: 普通敌人被定身{1}；精英和首领仍可移动，但视为冻结。你的冰霜法术对冻结的敌人必定造成致命一击，且你对其造成的致命一击伤害提高50%。
  zhTW: "普通敵人被定身{1}；精英和首領仍可移動，但視為凍結。你的冰霜法術對凍結的敵人必定造成致命一擊，且你對其造成的致命一擊傷害提高50%。"
  placeholders:
  - 1
- id: hoa.msg.term_static
  legacy_server_id: 499
  enUS: Static
  zhCN: 静电
  zhTW: "靜電"
- id: hoa.msg.rule_static
  legacy_server_id: 500
  enUS: at {1} stacks, lightning strikes the enemy and up to 3 enemies within 6 yards for {2}% of base health, raised by Power. It can crit.
  zhCN: 达到{1}层时，闪电会打击该敌人及其6码内最多3个敌人，造成基础生命值{2}%的伤害，受力量加成。可以造成致命一击。
  zhTW: "達到{1}層時，閃電會打擊該敵人及其6碼內最多3個敵人，造成基礎生命值{2}%的傷害，受力量加成。可以造成致命一擊。"
  placeholders:
  - 1
  - 2
- id: hoa.msg.term_hunters_mark
  legacy_server_id: 501
  enUS: Hunter's Mark
  zhCN: 猎人印记
  zhTW: "獵人印記"
- id: hoa.msg.rule_hunters_mark
  legacy_server_id: 502
  enUS: marked enemies take {1}% more damage from you and your summons, up to 30% with ranks and Mark upgrades. Talents add more. When a marked enemy dies, the mark passes to the 2 nearest unmarked enemies within 10 yards.
  zhCN: 被标记的敌人受到你和你的召唤物造成的伤害提高{1}%，施加标记的法术的等级和标记强化可将其最多提高至30%。天赋效果额外叠加。目标死亡时，标记会转移到10码内最近的2个未被标记的敌人身上。
  zhTW: "被標記的敵人受到你和你的召喚物造成的傷害提高{1}%，施加標記的法術的等級和標記強化可將其最多提高至30%。天賦效果額外疊加。目標死亡時，標記會轉移到10碼內最近的2個未被標記的敵人身上。"
  placeholders:
  - 1
- id: hoa.msg.term_judged
  legacy_server_id: 503
  enUS: Judged
  zhCN: 被审判
  zhTW: "被審判"
- id: hoa.msg.rule_judged
  legacy_server_id: 504
  enUS: enemies hit by Judgement of the Crusader take 20% more damage from you for 6 sec.
  zhCN: 被十字军审判击中的敌人受到你造成的伤害提高20%，持续6秒。
  zhTW: "被十字軍審判擊中的敵人受到你造成的傷害提高20%，持續6秒。"
- id: hoa.msg.term_dazed
  legacy_server_id: 505
  enUS: Dazed
  zhCN: 眩晕
  zhTW: "眩暈"
- id: hoa.msg.rule_dazed
  legacy_server_id: 506
  enUS: '{1}% slow for {2}. Only the strongest slow counts.'
  zhCN: 减速{1}%，持续{2}。只有效果最强的减速生效。
  zhTW: "減速{1}%，持續{2}。只有效果最強的減速生效。"
  placeholders:
  - 1
  - 2
- id: hoa.msg.term_vulnerabilities
  legacy_server_id: 507
  enUS: Vulnerabilities
  zhCN: 易伤
  zhTW: "易傷"
- id: hoa.msg.rule_vulnerabilities
  legacy_server_id: 508
  enUS: Fire +{1}%, Shadow +{2}%, Nature +{3}% and Sunder Armor (Physical) +{4}% damage taken per stack, up to 5 stacks.
  zhCN: 火焰易伤每层使受到的伤害提高{1}%，暗影易伤{2}%，自然易伤{3}%，破甲（物理）{4}%，最多5层。
  zhTW: "火焰易傷每層使受到的傷害提高{1}%，暗影易傷{2}%，自然易傷{3}%，破甲（物理）{4}%，最多5層。"
  placeholders:
  - 1
  - 2
  - 3
  - 4
- id: hoa.msg.rule_stuns
  legacy_server_id: 509
  enUS: Stuns last at most 2 sec, then the enemy can't be stunned for 6 sec. Bosses and mini-bosses can't be stunned.
  zhCN: 昏迷最多持续2秒，之后该敌人在6秒内无法再被昏迷。首领和小首领无法被昏迷。
  zhTW: "昏迷最多持續2秒，之後該敵人在6秒內無法再被昏迷。首領和小首領無法被昏迷。"
- id: hoa.msg.rule_roots
  legacy_server_id: 510
  enUS: Roots work only on normal enemies and last at most 2 sec. The enemy is then immune to roots for 6 sec. Frozen shares this timer.
  zhCN: 定身只对普通敌人有效，最多持续2秒，之后免疫6秒。冻结与其共用此计时。
  zhTW: "定身只對普通敵人有效，最多持續2秒，之後免疫6秒。凍結與其共用此計時。"
- id: hoa.msg.rule_knockbacks
  legacy_server_id: 511
  enUS: Knockbacks and pulls work only on normal enemies. The enemy is then immune to knockbacks for 6 sec, or to pulls for 3 sec.
  zhCN: 击退只对普通敌人有效，之后免疫6秒。牵引只对普通敌人有效，之后免疫3秒。
  zhTW: "擊退只對普通敵人有效，之後免疫6秒。牽引只對普通敵人有效，之後免疫3秒。"
- id: hoa.msg.rule_fear
  legacy_server_id: 512
  enUS: Fear and charm don't work on elites or bosses.
  zhCN: 恐惧和魅惑对精英和首领无效。
  zhTW: "恐懼和魅惑對精英和首領無效。"
- id: hoa.msg.rule_summon_stats
  legacy_server_id: 513
  enUS: Summons get your Power, critical strike chance and damage, Haste and Movement Speed. They never die and enemies ignore them.
  zhCN: 召唤物继承你的力量、致命一击几率和致命一击伤害、急速以及移动速度。它们永远不会死亡，敌人也会无视它们。
  zhTW: "召喚物繼承你的力量、致命一擊機率和致命一擊傷害、急速以及移動速度。它們永遠不會死亡，敵人也會無視它們。"
- id: hoa.msg.rule_summon_limits
  legacy_server_id: 514
  enUS: Summons don't get your Area. Their hits don't trigger Leech, trinkets or on-hit cards, but their kills count.
  zhCN: 召唤物不继承你的范围。它们的命中不会触发吸血、饰品或命中触发的卡片，但它们的击杀会计入。
  zhTW: "召喚物不繼承你的範圍。它們的命中不會觸發吸血、飾品或命中觸發的卡片，但它們的擊殺會計入。"
- id: hoa.msg.rule_summon_keyword
  legacy_server_id: 515
  enUS: Summon hits apply their spell's effects, like Burning or Chill.
  zhCN: 召唤物的每次命中都会施加其法术的效果，例如燃烧或冰寒。
  zhTW: "召喚物的每次命中都會施加其法術的效果，例如燃燒或冰寒。"
- id: hoa.msg.rule_summon_count
  legacy_server_id: 516
  enUS: Count adds pets, elementals, treants, totems and wolves.
  zhCN: 数量可增加宠物、元素、树人、图腾和狼。
  zhTW: "數量可增加寵物、元素、樹人、圖騰和狼。"
- id: hoa.msg.rule_summon_duration
  legacy_server_id: 517
  enUS: Summons that leave on their own, like snakes, beasts, Stampede, Spirit Pack wolves and warlock demons, last longer with Duration.
  zhCN: 会自行消失的召唤物（如毒蛇、野兽、兽群奔腾、灵魂之群的狼和术士的恶魔）受持续时间加成，存在时间更长。
  zhTW: "會自行消失的召喚物（如毒蛇、野獸、獸群奔騰、靈魂之群的狼和術士的惡魔）受持續時間加成，存在時間更長。"
- id: hoa.msg.term_trinkets
  legacy_server_id: 518
  enUS: Trinkets
  zhCN: 饰品
  zhTW: "飾品"
- id: hoa.msg.rule_trinkets
  legacy_server_id: 519
  enUS: 5% chance when a spell is cast, at most once per cooldown. Damage trinkets deal a share of that spell's next hit, more with Count, and can crit. Area doesn't affect them.
  zhCN: 施放法术时有5%几率触发，每个冷却周期最多一次。伤害类饰品按该法术下一次命中伤害的一定比例造成伤害，数量越多伤害越高，并且可以造成致命一击。范围不影响它们。
  zhTW: "施放法術時有5%機率觸發，每個冷卻週期最多一次。傷害類飾品按該法術下一次命中傷害的一定比例造成傷害，數量越多傷害越高，並且可以造成致命一擊。範圍不影響它們。"
- id: hoa.msg.rule_proc_next_hit
  legacy_server_id: 520
  enUS: Fire Burst, Shadow Burst, Chain Lightning and Death Ray can trigger when you cast a spell and strike with that spell's next hit.
  zhCN: 火焰爆发、暗影爆发、闪电链和死亡射线在施放法术时判定，并在该法术的下一次命中时触发。
  zhTW: "火焰爆發、暗影爆發、閃電鏈和死亡射線在施放法術時判定，並在該法術的下一次命中時觸發。"
- id: hoa.msg.rule_proc_chains
  legacy_server_id: 521
  enUS: Procs never trigger other trinkets or cards. Their hits can trigger Leech.
  zhCN: 触发效果永远不会触发其他饰品或卡片。它们的命中可以触发吸血。
  zhTW: "觸發效果永遠不會觸發其他飾品或卡片。它們的命中可以觸發吸血。"
- id: hoa.msg.rule_glyph_damage
  legacy_server_id: 522
  enUS: Glyph damage (Storm, Meteor, Shadowmourne) grows with base health, Power and run time, but not with difficulty. Storm always crits.
  zhCN: 雕文伤害（风暴、陨石、影之哀伤）随基础生命值、远征时长和力量提高，与难度无关。风暴必定造成致命一击。
  zhTW: "雕文傷害（風暴、隕石、影之哀傷）隨基礎生命值、遠征時長和力量提高，與難度無關。風暴必定造成致命一擊。"
- id: hoa.msg.rule_gear_stats
  legacy_server_id: 523
  enUS: Gear gives its listed stats plus its bonus stats.
  zhCN: 装备提供其所列属性以及额外属性。
  zhTW: "裝備提供其所列屬性以及額外屬性。"
- id: hoa.msg.term_gear_tiers
  legacy_server_id: 524
  enUS: Item Level (ilvl)
  zhCN: 物品等级（ilvl）
  zhTW: "物品等級（ilvl）"
- id: hoa.msg.rule_gear_tiers
  legacy_server_id: 525
  enUS: Every piece has an Item Level. A higher Item Level gives more Power, Max Health and Armor, whatever the quality; twice the Item Level doubles them. Other stats don't change.
  zhCN: 每件装备都有物品等级：无论品质如何，物品等级越高，提供的力量、最大生命值和护甲就越多。物品等级翻倍，这些属性也翻倍。其他属性保持不变。
  zhTW: "每件裝備都有物品等級：無論品質如何，物品等級越高，提供的力量、最大生命值和護甲就越多。物品等級翻倍，這些屬性也翻倍。其他屬性保持不變。"
- id: hoa.msg.rule_trinket_tiers
  legacy_server_id: 526
  enUS: Trinket effects don't grow with Item Level; their stats do.
  zhCN: 饰品的特效不随物品等级提高，但其属性会提高。
  zhTW: "飾品的特效不隨物品等級提高，但其屬性會提高。"
- id: hoa.msg.term_scrap
  legacy_server_id: 527
  enUS: Scrap
  zhCN: 废料
  zhTW: "廢料"
- id: hoa.msg.rule_scrap
  legacy_server_id: 528
  enUS: items you don't extract from a run turn into Scrap, more for higher Item Levels and more bonus stats. Elites drop a little too. Spend it at Durgan Ironbelly to upgrade a piece up to 3 times, one Mythic level each time, never past the highest level you have cleared. For gold, he rerolls one bonus stat per item.
  zhCN: 每次远征中你没有提取的物品都会提供废料，物品等级越高、额外属性越多，提供的越多。精英也会掉落少量废料。德尔冈·铁腹可以用废料将一件装备最多升级3次，每次提升一个史诗等级，且永远不会超过你已通关的最高级别。支付金币后，他可以为每件物品重选一项额外属性。
  zhTW: "每次遠征中你沒有提取的物品都會提供廢料，物品等級越高、額外屬性越多，提供的越多。精英也會掉落少量廢料。德爾岡·鐵腹可以用廢料將一件裝備最多升級3次，每次提升一個史詩等級，且永遠不會超過你已通關的最高階別。支付金幣後，他可以為每件物品重選一項額外屬性。"
- id: hoa.msg.rule_damage_order
  legacy_server_id: 529
  enUS: Damage you take is reduced by Dodge, then damage reduction, then Armor, then Shield.
  zhCN: 你受到的伤害会依次经过闪避、伤害减免、护甲和护盾的削减。
  zhTW: "你受到的傷害會依次經過閃避、傷害減免、護甲和護盾的削減。"
- id: hoa.msg.rule_dash_immune
  legacy_server_id: 530
  enUS: Dash makes you immune to damage for 0.25 sec.
  zhCN: 冲刺会使你在0.25秒内免疫伤害。
  zhTW: "衝刺會使你在0.25秒內免疫傷害。"
- id: hoa.msg.rule_healing_orbs
  legacy_server_id: 531
  enUS: Healing orbs heal 20% of maximum health. Each level gained heals 5%.
  zhCN: 治疗球恢复20%最大生命值。每次升级恢复5%。
  zhTW: "治療球恢復20%最大生命值。每次升級恢復5%。"
- id: hoa.msg.rule_healing_cuts
  legacy_server_id: 532
  enUS: Necrotic, boss wounds and Cursed Ground reduce healing taken, up to 100%.
  zhCN: 死疽、首领造成的创伤和诅咒之地会降低受到的治疗效果，最多降低100%。
  zhTW: "死疽、首領造成的創傷和詛咒之地會降低受到的治療效果，最多降低100%。"
- id: hoa.msg.term_revives
  legacy_server_id: 533
  enUS: Revives
  zhCN: 复活
  zhTW: "復活"
- id: hoa.msg.rule_revives
  legacy_server_id: 534
  enUS: when you die, Glyph of Divine Shield saves you first, then Second Chance, then a Soulstone. A revive restores your health, shields you and destroys normal enemies within 15 yards.
  zhCN: 你死亡时，首先由圣盾术雕文救你，其次是第二次机会，最后是灵魂石。复活会恢复你的生命值，为你施加护盾，并消灭15码内的普通敌人。
  zhTW: "你死亡時，首先由聖盾術雕文救你，其次是第二次機會，最後是靈魂石。復活會恢復你的生命值，為你施加護盾，並消滅15碼內的普通敵人。"
