- id: hoa.msg.rule_ranks
  legacy_server_id: 478
  enUS: 'Common +{1}% damage, Uncommon +{2}%, Rare +{3}% and 1 upgrade, Epic +{4}% and 2 upgrades. Spells without damage get upgrades instead. Past rank 20 the damage per rank shrinks: rank 40 adds half, rank 80 a quarter.'
  zhCN: 普通+{1}%伤害，优秀+{2}%，精良+{3}%并获得1项强化，史诗+{4}%并获得2项强化。没有伤害的法术改为获得强化。超过20级后，每级增加的伤害逐渐减少：到40级时为一半，到80级时为四分之一。
  zhTW: "普通+{1}%傷害，優秀+{2}%，精良+{3}%並獲得1項強化，史詩+{4}%並獲得2項強化。沒有傷害的法術改為獲得強化。超過20級後，每級增加的傷害逐漸減少：到40級時為一半，到80級時為四分之一。"
