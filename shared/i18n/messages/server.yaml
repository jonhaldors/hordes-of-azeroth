  zhCN: 受急速缩短，其中包括法术自身的急速强化。最低0.2秒。范围内没有目标的法术会等待，而不是进入冷却。
  zhTW: "受急速縮短，其中包括法術自身的急速強化。最低0.2秒。範圍內沒有目標的法術會等待，而不是進入冷卻。"
