- id: hoa.msg.shrine_greed_totem_text
  legacy_server_id: 779
  enUS: Gain 5% more gold and Darkmoon Tickets for the rest of the run, but more enemies attack. Each totem you use adds to both.
  zhCN: 本次远征剩余时间内获得的金币和暗月奖券提高5%，但会有更多敌人来袭。每使用一个图腾，两种效果都会进一步叠加。
